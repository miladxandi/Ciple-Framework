  build-and-release-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
          build-essential \
          cmake \
          g++ \
          ninja-build \
          && sudo rm -rf /var/lib/apt/lists/*
      - name: Download Conan & reqs
        run: |
          sudo wget https://github.com/conan-io/conan/releases/download/2.8.0/conan-2.8.0-amd64.deb && sudo dpkg -i conan-2.8.0-amd64.deb
          sudo conan profile detect
          sudo conan remote update conancenter --url="https://center2.conan.io"
          PROFILE_PATH="$HOME/.conan2/profiles/default"
          sudo conan install . --build=missing -s compiler.cppstd=23
      - name: Build with Cmake
        run: |
          sudo cmake -G Ninja -DCMAKE_PREFIX_PATH=build/Release/generators  -DCMAKE_BUILD_TYPE=Release .
          sudo cmake --build . --config Release
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }} # e.g., refs/tags/v1.0.0
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # Use the upload_url from the create_release step
          asset_path: ./Ciple-Framework
          asset_name: Ciple-Framework
          asset_content_type: application/octet-stream